# This week's configured matchup(s). "team_a" is the reference side
# (positive composite favors team_a); side is which trench matchup this row
# scores: team_a's OFFENSIVE line vs team_b's DEFENSIVE line.
#
# year: current in-progress season, not last season's final numbers.
# Confirmed live 2026-09-15: 2025 is a completed 16-game season, 2026 is
# in progress (2 games played) -- this is the actual current slate.
year: 2026
matchups:
  - label: 2026-wk03-miami-wake
    team_a: Miami
    team_b: Wake Forest
    side: team_a_ol_vs_team_b_dl
    # Matches the SP+ sheet's "FBS Week {week}" tab naming (see
    # fetch_sp_plus.py / README.md) -- not auto-detected, since a
    # nonexistent tab name silently falls back to unrelated data instead
    # of erroring (confirmed live).
    week: 3
    # sp_plus_gap is fetched live each run from fetch_sp_plus.py (Bill
    # Connelly's weekly SP+ sheet) when `week` is set above. This value is
    # a fallback only, used if that live fetch fails. Last known-good,
    # pulled live 2026-09-15 (FBS Week 3 tab): Miami 25.6, Wake Forest
    # 3.4 -> 22.2 (same gap the TOP 772 tab's larger absolute scale also
    # gives -- confirmed the two tabs differ by a constant offset that
    # cancels in a difference; see fetch_sp_plus.py docstring).
    sp_plus_gap: 22.2
