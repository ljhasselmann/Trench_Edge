# Copy this file to config/rosters/{Team Name}.yaml (match the exact team
# name CFBD uses, e.g. "Miami", "Wake Forest") and fill in this week's
# starting offensive and defensive line, by name, from real depth-chart
# reporting. `name` must match the player's name in CFBD's /roster response
# closely enough for fetch_roster.py's case-insensitive lookup to find them
# (it flags a mismatch loudly rather than silently dropping the player, so
# a near-miss is safe to leave and fix next run).
#
# `weight` here is optional and only used as a fallback estimate if CFBD's
# live roster can't find the player (transfer, walk-on not yet listed,
# name spelled differently). When present, source/confidence must be set
# and the composite output will visibly flag it as estimated, per
# DESIGN.md Section 6 -- never let an estimate pass as a confirmed number.
#
# updated_by_human_at: ISO 8601 date. fetch_roster.py flags this list as
# stale after 7 days (DESIGN.md Section 4b point 3) -- depth charts change
# from injuries, suspensions, and true freshmen beating out incumbents
# mid-season.
#
# prior_season_starters: OPTIONAL FALLBACK ONLY, not required. Returning
# experience (DESIGN.md Section 4c/5) is now computed automatically --
# fetch_talent.py matches this year's `starters` (above) against real
# per-player snap counts from puntandrally.com's prior-season roster page
# (fetch_puntandrally.py's `year=` param), no human data entry needed. This
# block is only used as a fallback if that live year-over-year fetch fails
# for a team (site issue, or a team predating puntandrally's ~2022
# reliability floor) -- in that case fetch_talent.py falls back to a
# coarser, non-snap-weighted name-overlap against whatever's typed here. A
# stale or empty block here is harmless as long as the live fetch is
# working; only fill it in if you've seen a warning that the live fetch
# failed for a specific team.
#
# continuity_note: also set once per season. DESIGN.md Section 4c's
# qualitative flag -- is this unit's level talent-driven or coaching/
# scheme-driven, per beat reporting. driver is "talent" | "scheme" | "mixed".
# There's no specified numeric discount for this in DESIGN.md -- it's
# surfaced as a caveat on the rendered output, not auto-applied to the score.

team: TEMPLATE
updated_by_human_at: "2026-01-01"
starters:
  OL:
    - name: "First Last"
      # weight: 315          # only needed if CFBD's live roster won't have them
      # source: "beat-reporter depth chart, <outlet>, <date>"
      # confidence: "estimated"
  DL:
    - name: "First Last"
prior_season_starters:
  OL:
    - name: "First Last"
  DL:
    - name: "First Last"
continuity_note:
  driver: "scheme"  # "talent" | "scheme" | "mixed"
  note: "One sentence citing the beat reporting this is based on."
